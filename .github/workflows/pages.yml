name: Deploy WebAssembly Studio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile fresh C++20 `docs/minecc.wasm`
        run: |
          python3 -m pip install ziglang
          python3 -m ziglang c++ -std=c++20 -Os -DNDEBUG -fno-exceptions -s \
            -target wasm32-wasi -mexec-model=reactor -Wl,--export-dynamic \
            -I. native/wasm/minecc_wasm.cpp -o docs/minecc.wasm
      - name: Configure & Auto-Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload `docs/` WebAssembly Studio Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

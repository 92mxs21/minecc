<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>mcsrc / minecc — Minecraft 26.3 Native Code Explorer</title>
  <link rel="stylesheet" href="mcsrc.css" />
</head>
<body>
  <div id="app-shell" class="app-shell">
    <!-- Left 25% SideBar (modeled on FabricMC/mcsrc SideBar.tsx + Header.tsx) -->
    <div id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="header-row-top">
          <div class="brand-wrap">
            <span class="brand-dot" data-icon="class"></span>
            <span class="brand-title">mcsrc</span>
          </div>
          <div class="header-actions">
            <button id="btn-version" class="hdr-btn hdr-btn-version" data-action="cycle-version">26.3 &#9662;</button>
            <button id="btn-compare" class="hdr-btn" data-action="toggle-compare">
              <span class="btn-ic" data-icon="compare"></span>
              <span>Compare</span>
            </button>
            <button id="btn-open-jar" class="hdr-btn hdr-btn-primary" data-action="open-jar">
              <span class="btn-ic" data-icon="jar"></span>
              <span>Open JAR</span>
            </button>
            <button id="btn-theme" class="hdr-btn" data-action="toggle-theme" title="Switch Dark / Light Theme">Light</button>
          </div>
        </div>

        <!-- Search input + scope selector (Classes / Methods / Fields / Content) -->
        <div class="search-box">
          <span class="search-ic" data-icon="search"></span>
          <input id="search-input" class="search-input" placeholder="Search classes, methods, fields..." value="" />
        </div>
        <div id="scope-bar" class="scope-bar"></div>
      </div>

      <!-- Package & Class Tree / Search Results -->
      <div id="tree-list" class="tree-list"></div>

      <!-- Clean-Room Status Footer -->
      <div id="sidebar-footer" class="sidebar-footer"></div>
    </div>

    <!-- Right 75% Editor Pane (TabsComponent + FilepathHeader + Monaco-style Code View) -->
    <div id="main-pane" class="main-pane">
      <!-- Top Open-Class Tabs + View Switcher -->
      <div class="tabs-bar">
        <div id="tabs-strip" class="tabs-strip"></div>
        <div id="mode-strip" class="mode-strip"></div>
      </div>

      <!-- Slash-separated Filepath Breadcrumb + Diff +N/-M Stats -->
      <div id="filepath-bar" class="filepath-bar"></div>

      <!-- Main Scrollable Code / Bytecode / Inheritance / Diff Surface -->
      <div id="code-scroll" class="code-scroll"></div>

      <!-- Bottom Status & Engine Telemetry Bar -->
      <div id="status-bar" class="status-bar"></div>
    </div>
  </div>

  <script src="mcsrc.js"></script>
</body>
</html>

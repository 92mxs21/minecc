[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minecc"
version = "2.0.0"
description = "Native C++20 self-rendered dark Java/Minecraft reverse-engineering studio, minimal HTML+CSS AOT compiler, and Ghidra-grade headless AI CLI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
minecc = "minecc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

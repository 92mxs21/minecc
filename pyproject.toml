[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minecc"
version = "0.1.0"
description = "Clean-room local JVM bytecode inspector, checksum verifier, and Vineflower decompilation runner for locally installed Minecraft: Java Edition builds."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
minecc = "minecc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
